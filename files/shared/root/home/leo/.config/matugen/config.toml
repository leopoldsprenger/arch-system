[config]
version_check = false
caching = false

[config.wallpaper]
set = false
command = "awww"
arguments = ["img"]

[templates.btop]
input_path = '~/.config/matugen/templates/btop.theme'
output_path = '~/.config/btop/themes/matugen.theme'
post_hook = 'pkill -USR2 -x btop || true'

[templates.foot]
input_path = '~/.config/matugen/templates/foot-colors.ini'
output_path = '~/.config/matugen/generated/foot-colors.ini'
post_hook = '''
  ln -nfs "$HOME/.config/matugen/generated/foot-colors.ini" "$HOME/.config/foot/foot-colors.ini"
  pkill -USR1 -x foot || true
'''

[templates.yazi]
input_path = '~/.config/matugen/templates/yazi-theme.toml'
output_path = '~/.config/yazi/theme.toml'

[templates.mango]
input_path = '~/.config/matugen/templates/mango.conf'
output_path = '~/.config/mango/colors.conf'
post_hook = 'mmsg dispatch reload_config > /dev/null 2>&1'

[templates.starship]
input_path = '~/.config/matugen/templates/starship.toml'
output_path = '~/.config/matugen/generated/starship.toml'

[templates.neovim]
input_path = "~/.config/matugen/templates/nvim.lua"
output_path = "~/.config/nvim/lua/config/matugen_colors.lua"
post_hook = "pkill -SIGUSR1 -x nvim || true"

[templates.zathura]
input_path = '~/.config/matugen/templates/zathura'
output_path = '~/.config/zathura/zathurarc-matugen'

[templates.pywalfox]
input_path = '~/.config/matugen/templates/pywalfox-colors.json'
output_path = '~/.cache/wal/colors.json'
post_hook = 'pywalfox update || true'
