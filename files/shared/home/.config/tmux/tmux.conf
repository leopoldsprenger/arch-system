# =====================================================================
# TMUX — Arch Linux | Slim Powerline | Matugen | zsh
# =====================================================================

# --- Base settings ----------------------------------------------------
set -g default-terminal "tmux-256color"
set -g default-shell "/bin/zsh"
set -g default-command "/bin/zsh"

set -g clock-mode-style 24
set -g mode-keys vi
set -g status-keys vi
set -g mouse on

# Start windows and panes at index 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Prefix: Ctrl-b
set -g prefix C-b
unbind C-a
bind C-b send-prefix

bind -n C-d detach-client

# --- Terminal colors --------------------------------------------------
set -as terminal-overrides ",*:Setulc=\\E[58::2::%%p1%%d::%%p2%%d::%%p3%%d::m"
set -as terminal-overrides ",xterm*:Tc,foot*:Tc,*-256color:Tc"

# --- Status bar -------------------------------------------------------
set -g status-position bottom
set -g status-justify left
set -g status-left ""
set -g status-right ""

# --- Matugen theme ----------------------------------------------------
if-shell "test -f ~/.config/tmux/theme.conf" \
  "source-file ~/.config/tmux/theme.conf"

set -g status-style "bg=terminal,fg=#{@thm_fg}"

# Remove default decorations
setw -g window-status-style none
setw -g window-status-current-style none
setw -g window-status-activity-style none

# Reload theme whenever a client attaches
set-hook -g client-attached {
  if-shell "test -f ~/.config/tmux/theme.conf" \
    "source-file ~/.config/tmux/theme.conf"

  set -g status-style "bg=terminal,fg=#{@thm_fg}"
  set -g status-left ""
  set -g status-right ""

  setw -g window-status-style none
  setw -g window-status-current-style none
  setw -g window-status-activity-style none

  refresh-client -S
}

# --- Window naming ----------------------------------------------------
setw -g automatic-rename on
set -g allow-rename on

# --- Slim window pills (no extra padding) -----------------------------
set -g window-status-format '#[fg=#{@thm_surface_highest},bg=terminal]#[fg=#{@thm_text_variant},bg=#{@thm_surface_highest}]#I:#W#[fg=#{@thm_surface_highest},bg=terminal]'
set -g window-status-current-format '#[fg=#{@thm_primary},bg=terminal]#[fg=#{@thm_on_primary},bg=#{@thm_primary},bold]#I:#W#[fg=#{@thm_primary},bg=terminal]'

# --- Navigation: Ctrl + Arrow keys -----------------------------------
bind -n C-Left select-pane -L
bind -n C-Right select-pane -R
bind -n C-Up select-pane -U
bind -n C-Down select-pane -D
