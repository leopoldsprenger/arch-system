include=~/.config/fuzzel/colors.ini

[main]
font=GeistMono Nerd Font:size=12
prompt="❯ "
icon-theme=Adwaita
fields=name,generic,comment,exec
terminal=foot

# Formatting a clean, appealing layout
lines=12
width=40
horizontal-pad=24
vertical-pad=16
inner-pad=10

[border]
width=2
radius=8   # Gives you that sharp, slightly rounded square aesthetic
