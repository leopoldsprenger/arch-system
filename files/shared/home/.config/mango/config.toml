[global]

# --- Input ---
repeat_rate = 50
repeat_delay = 300
numlock_on = 0
xkb_rules_layout = "us"

# --- Cursor: preserve Arch settings ---
cursor_theme = "Bibata-Modern-Ice"
cursor_size = 24
cursor_hide_timeout = 3
cursor_hide_on_keypress = 1

# --- Layouts ---
tag_num = 5
new_is_master = 1
default_master_factor = 0.55
default_master_count = 1

dwindle_smart_split = 0
dwindle_drop_simple_split = 1
dwindle_manual_split = 0
dwindle_horizontal_split = 1
dwindle_vertical_split = 1
dwindle_preserve_split = 0

# --- Glaze / X-ray appearance ---
gap_inner_horizontal = 4
gap_inner_vertical = 4
gap_outer_horizontal = 6
gap_outer_vertical = 6
border_px = 1
border_radius = 8

root_color = 0x1e1e2eff
border_color = 0x31324466
focus_color = 0x74c7ecb3
urgent_color = 0xf38ba8ff

# Preserve the other starter colors
drop_color = 0x8FBA7C55
split_color = 0xEB441EFF
maximized_screen_color = 0x89aa61ff
scratchpad_color = 0x516c93ff
global_color = 0xb153a7ff
overlay_color = 0x14a57cff

# --- Blur ---
blur = 1
blur_layer = 1
blur_optimized = 1
blur_params_num_passes = 4
blur_params_radius = 5
blur_params_noise = 0.08
blur_params_saturation = 10

# --- Opacity ---
focused_opacity = 0.93
unfocused_opacity = 0.93
dim_enable = 0

# --- Animations ---
animations = 1
layer_animations = 1

animation_duration_move = 180
animation_duration_open = 160
animation_duration_tag = 140
animation_duration_close = 120
animation_duration_focus = 100

animation_type_open = "slide"
animation_type_close = "slide"
animation_fade_in = 1
animation_fade_out = 1

animation_curve_open = [0.46, 1.0, 0.29, 1]
animation_curve_move = [0.46, 1.0, 0.29, 1]
animation_curve_tag = [0.46, 1.0, 0.29, 1]
animation_curve_close = [0.08, 0.92, 0, 1]
animation_curve_focus = [0.46, 1.0, 0.29, 1]

# --- Misc ---
focus_on_activate = 1
sloppy_focus = 1
warp_cursor = 1
focus_cross_monitor = 0
focus_cross_tag = 0
focus_direction_only_zone_overlap = 1
enable_floating_snap = 0
snap_distance = 30
drag_tile_to_tile = 1
drag_tile_small = 1

# --- Trackpad ---
disable_trackpad = 0
tap_to_click = 1
tap_and_drag = 1
drag_lock = 1
trackpad_natural_scrolling = 0
trackpad_disable_while_typing = 1
trackpad_left_handed = 0
trackpad_middle_button_emulation = 0
swipe_min_threshold = 1

# --- Mouse ---
mouse_natural_scrolling = 0

# --- Scroller ---
scroller_structs = 20
scroller_default_proportion = 0.8
scroller_focus_center = 0
scroller_prefer_center = 0
edge_scroller_pointer_focus = 1
edge_scroller_focus_allow_speed = 0.0
scroller_default_proportion_single = 1.0
scroller_proportion_preset = [0.5, 0.8, 1.0]

# --- Other layout settings ---
smart_gaps = 0
monocle_tab_mode = 1
monocle_no_border = 0
monocle_no_gap = 0
deck_tab_mode = 1

# --- Overview ---
hotarea_size = 10
enable_hotarea = 0
hotarea_disable_on_fullscreen = 1
overview_gap_inner = 5
overview_gap_outer = 30
overcircle_center_ratio = 0.5
title_message_bar_height = 52
title_message_bar_gap = 20

# --- Startup ---
exec_once = awww-daemon
exec_once = swaync
exec_once = swayosd-server
exec_once = waybar
exec_once = wl-paste --type text --watch cliphist store
exec_once = wl-paste --type image --watch cliphist store
exec_once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec_once = swayidle -w timeout 600 'swaylock --config ~/.config/swaylock/config --config ~/.config/swaylock/colors' before-sleep 'swaylock --config ~/.config/swaylock/config --config ~/.config/swaylock/colors'

# --- Optional dynamic wallpaper colors ---
source = [
  "~/.config/mango/colors.conf",
  "~/.config/mango/local_monitor.toml"
]

[bind.default]

# --- Core ---
"SUPER+Shift+w" = "spawn,sh -c 'mmsg dispatch reload_config && waybar --reload'"

# Fuzzel
"SUPER+space" = "spawn,fuzzel"
"SUPER+period" = "spawn,bemoji -t"
"SUPER+equal" = "spawn,~/.local/bin/fuzzel-calculator.sh"
"SUPER+p" = "spawn,~/.local/bin/fuzzel-powermenu.sh"
"SUPER+shift+f" = "spawn,~/.local/bin/fuzzel-files.sh"
"SUPER+m" = "spawn,~/.local/bin/fuzzel-wallpapers.sh"

# Foot instead of Kitty
"SUPER+q" = "killclient,"
"SUPER+return" = "spawn,foot"
"SUPER+b" = "spawn,firefox"
"SUPER+e" = "spawn,foot -e yazi"
"SUPER+Shift+e" = "spawn,foot -e yazi"

# Session
"SUPER+l" = "spawn,swaylock --config ~/.config/swaylock/config --config ~/.config/swaylock/colors"

# Utilities
"SUPER+Shift+c" = "spawn,clipboard pick"
"SUPER+x" = "spawn,foot --app-id=float-tui -e nmtui"
"SUPER+z" = "spawn,blueman-manager"
"SUPER+c" = "spawn,swaync-client -t -sw"

# Screenshots
"SUPER+Shift+r" = "spawn,~/.local/bin/screenshot full"
"SUPER+r" = "spawn,~/.local/bin/screenshot"

# --- Window navigation ---
"SUPER+Left" = "focusdir,left"
"SUPER+Right" = "focusdir,right"
"SUPER+Up" = "focusdir,up"
"SUPER+Down" = "focusdir,down"

# Exchange / move windows
"SUPER+Shift+Left" = "exchange_client,left"
"SUPER+Shift+Right" = "exchange_client,right"
"SUPER+Shift+Up" = "exchange_client,up"
"SUPER+Shift+Down" = "exchange_client,down"

# --- Layouts ---
"SUPER+Shift+t" = "setlayout,dwindle"
"SUPER+Shift+s" = "setlayout,scroller"
"SUPER+n" = "switch_layout"

# --- Workspaces / tags ---
"SUPER+1" = "view,1"
"SUPER+2" = "view,2"
"SUPER+3" = "view,3"
"SUPER+4" = "view,4"
"SUPER+5" = "view,5"

"SUPER+Shift+1" = "tag,1"
"SUPER+Shift+2" = "tag,2"
"SUPER+Shift+3" = "tag,3"
"SUPER+Shift+4" = "tag,4"
"SUPER+Shift+5" = "tag,5"

# --- Window states ---
"ALT+Tab" = "togglejump,"
"ALT+backslash" = "togglefloating,"
"ALT+a" = "togglemaximizescreen,"
"SUPER+f" = "togglefullscreen,"
"ALT+Shift+f" = "togglefakefullscreen,"
"SUPER+g" = "toggleglobal,"
"ALT+z" = "toggle_scratchpad"

# --- Scroller ---
"ALT+e" = "set_proportion,1.0"
"ALT+x" = "switch_proportion_preset,"
"alt+super+ctrl+Left" = "scroller_stack,left"
"alt+super+ctrl+Right" = "scroller_stack,right"
"alt+super+ctrl+Up" = "scroller_stack,up"
"alt+super+ctrl+Down" = "scroller_stack,down"

# --- Dwindle ---
"ALT+Shift+Return" = "dwindle_toggle_split_direction"

# --- Gaps ---
"ALT+Shift+x" = "incgaps,1"
"ALT+Shift+z" = "incgaps,-1"
"ALT+Shift+r" = "togglegaps"

# --- Resize ---
"CTRL+ALT+Up" = "resizewin,+0,-50"
"CTRL+ALT+Down" = "resizewin,+0,+50"
"CTRL+ALT+Left" = "resizewin,-50,+0"
"CTRL+ALT+Right" = "resizewin,+50,+0"

# --- Keyboard layout ---
"SUPER+Shift+i" = "spawn,fcitx5-cycle-layouts"


[mousebind.default]

"SUPER+btn_left" = "moveresize,curmove"
"btn_middle" = "togglemaximizescreen,0"
"SUPER+btn_right" = "moveresize,curresize"


[axisbind.default]

"SUPER+UP" = "viewtoleft_have_client"
"SUPER+DOWN" = "viewtoright_have_client"


[gesturebind.default]

"none+left+3" = "focusdir,left"
"none+right+3" = "focusdir,right"
"none+up+3" = "focusdir,up"
"none+down+3" = "focusdir,down"
"none+right+4" = "viewprev_have_client"
"none+left+4" = "viewnext_have_client"
"none+up+4" = "enteroverview"
"none+down+4" = "leaveoverview"


# --- Window rules ---

[[rule.window_rule]]
no_border = 1
app_id = ".*"

[[rule.window_rule]]
is_floating = 1
app_id = "firefox"
title = "^Picture-in-Picture$"

[[rule.window_rule]]
focused_opacity = 1.0
unfocused_opacity = 1.0
app_id = "firefox"

[[rule.window_rule]]
focused_opacity = 0.85
unfocused_opacity = 0.85
app_id = "foot"

[[rule.window_rule]]
is_floating = 1
width = 900
height = 560
app_id = "^float-tui$"

[[rule.window_rule]]
is_floating = 1
width = 700
height = 480
app_id = ".*blueman.*"

[[rule.window_rule]]
is_floating = 1
width = 800
height = 520
app_id = ".*pavucontrol.*"

[[rule.window_rule]]
is_floating = 1
app_id = "^stride-quick-capture$"


# --- Layer rules ---

[[rule.layer_rule]]
layer_name = "awww-daemon"
no_blur = 1
no_shadow = 1

[[rule.layer_rule]]
layer_name = "selection"
animation_type_open = "none"
no_blur = 1

[[rule.layer_rule]]
layer_name = "swaync.*"
animation_type_open = "none"

[[rule.layer_rule]]
layer_name = "swayosd"
animation_type_open = "none"


# --- Tag rules: Dwindle everywhere ---

[[rule.tag_rule]]
id = 1
layout_name = "dwindle"

[[rule.tag_rule]]
id = 2
layout_name = "dwindle"

[[rule.tag_rule]]
id = 3
layout_name = "dwindle"

[[rule.tag_rule]]
id = 4
layout_name = "dwindle"

[[rule.tag_rule]]
id = 5
layout_name = "dwindle"
