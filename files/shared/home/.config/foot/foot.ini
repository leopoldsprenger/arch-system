[main]
font=GeistMono Nerd Font Mono:size=11
font-bold=GeistMono Nerd Font Mono:size=11:style=Bold
font-italic=GeistMono Nerd Font Mono:size=11:style=Italic
font-bold-italic=GeistMono Nerd Font Mono:size=11:style=Bold Italic
line-height=13.2
pad=15x15
dpi-aware=yes
initial-color-theme=dark
include=~/.config/foot/foot-colors.ini

[cursor]
style=block
blink=yes
blink-rate=500
beam-thickness=1.5

[colors-dark]
alpha=1.0

[csd]
preferred=none

[url]
osc8-underline=url-mode

[scrollback]
indicator-position=none
