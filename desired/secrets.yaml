# Encrypted secrets (sops+age) mapped to destinations. Deployed ONLY by "archivist secrets decrypt",
# never by "apply". Create entries with "archivist secrets encrypt".
schema_version: 1
secrets:
  - source: secrets/shared/home/.ssh/id_ed25519.enc.json
    destination: ~/.ssh/id_ed25519
    hosts: '*'
    mode: "0600"
    conflict: backup
