    mode: "0755"
    conflict: backup
  - source: files/shared/home/.local/bin/fuzzel-powermenu.sh
    destination: ~/.local/bin/fuzzel-powermenu.sh
    hosts: '*'
    mode: "0755"
    conflict: backup
  - source: files/shared/home/.config/mimeapps.list
    destination: ~/.config/mimeapps.list
    hosts: '*'
    mode: "0644"
    conflict: backup
  - source: files/shared/home/.config/swaylock/config
    destination: ~/.config/swaylock/config
    hosts: '*'
    mode: "0644"
    conflict: backup
  - source: files/shared/home/.config/tmux/tmux.conf
    destination: ~/.config/tmux/tmux.conf
    hosts: '*'
    mode: "0644"
    conflict: backup
  - source: files/shared/home/.local/bin/fuzzel-wallpapers.sh
    destination: ~/.local/bin/fuzzel-wallpapers.sh
    hosts: '*'
    mode: "0755"
    conflict: backup
  - source: files/shared/home/.local/shared/dbus-1/services/org.freedesktop.Notifications.service
    destination: ~/.local/shared/dbus-1/services/org.freedesktop.Notifications.service
    hosts: '*'
