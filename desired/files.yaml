  - source: files/shared/home/.config/swaync/config.json
    destination: ~/.config/swaync/config.json
    hosts: '*'
    mode: "0644"
    conflict: backup
  - source: files/shared/home/.config/swaync/style.css
    destination: ~/.config/swaync/style.css
