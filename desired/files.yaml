# Desired configuration files (user-authored; capture never writes this file).
# source:      repository path under files/
# destination: absolute path or "~/..." (expanded for the invoking user)
# conflict:    skip (default) | backup | replace
schema_version: 1
files:
  - source: files/shared/home/.config/mango/config.toml
    destination: ~/.config/mango/config.toml
    hosts: '*'
    mode: "0644"
    conflict: backup
  - source: files/shared/home/.bash_profile
    destination: ~/.bash_profile
    hosts: '*'
    mode: "0644"
    conflict: backup
  - source: files/shared/home/.bashrc
    destination: ~/.bashrc
    hosts: '*'
    mode: "0644"
    conflict: backup
  - source: files/shared/home/.config/foot/foot.ini
    destination: ~/.config/foot/foot.ini
    hosts: '*'
    mode: "0644"
    conflict: backup
  - source: files/shared/home/.config/gtk-3.0/settings.ini
    destination: ~/.config/gtk-3.0/settings.ini
    hosts: '*'
    mode: "0644"
    conflict: backup
  - source: files/shared/home/.icons/default/index.theme
    destination: ~/.icons/default/index.theme
    hosts: '*'
    mode: "0644"
    conflict: backup
  - source: files/shared/home/.config/btop/btop.conf
    destination: ~/.config/btop/btop.conf
    hosts: '*'
    mode: "0644"
    conflict: backup
  - source: files/shared/home/.local/bin/wallpaper
    destination: ~/.local/bin/wallpaper
    hosts: '*'
    mode: "0755"
    conflict: backup
  - source: files/shared/home/.config/fastfetch/config.jsonc
    destination: ~/.config/fastfetch/config.jsonc
    hosts: '*'
    mode: "0644"
    conflict: backup
  - source: files/shared/home/.gitconfig
    destination: ~/.gitconfig
    hosts: '*'
    mode: "0644"
    conflict: backup
  - source: files/shared/home/.zshrc
    destination: ~/.zshrc
    hosts: '*'
    mode: "0644"
    conflict: backup
  - source: files/shared/home/.config/starship.toml
    destination: ~/.config/starship.toml
    hosts: '*'
    mode: "0644"
    conflict: backup
  - source: files/shared/home/.zprofile
    destination: ~/.zprofile
    hosts: '*'
    mode: "0644"
    conflict: backup
  - source: files/hosts/macbook-vm/home/.config/mango/local_monitor.toml
    destination: ~/.config/mango/local_monitor.toml
    hosts:
      - macbook-vm
    mode: "0644"
    conflict: backup
  - source: files/shared/home/.gitignore_global
    destination: ~/.gitignore_global
    hosts: '*'
    mode: "0644"
    conflict: backup
  - source: files/shared/root/etc/ly/config.ini
    destination: /etc/ly/config.ini
    hosts: '*'
    mode: "0644"
    conflict: backup
  - source: files/shared/root/etc/systemd/system/ly@tty2.service.d/override.conf
    destination: /etc/systemd/system/ly@tty2.service.d/override.conf
    hosts: '*'
    mode: "0644"
    conflict: backup
  - source: files/shared/root/usr/lib/firefox/distribution/policies.json
    destination: /usr/lib/firefox/distribution/policies.json
    hosts: '*'
    mode: "0644"
    conflict: backup
  - source: files/shared/home/.config/matugen
    destination: ~/.config/matugen
    hosts: '*'
    conflict: backup
    exclude:
      - generated
  - source: files/shared/home/Pictures/wallpapers
    destination: ~/Pictures/wallpapers
    hosts: '*'
    conflict: backup
  - source: files/shared/home/.config/zathura/zathurarc
    destination: ~/.config/zathura/zathurarc
    hosts: '*'
    mode: "0644"
    conflict: backup
  - source: files/shared/home/.local/bin/projects
    destination: ~/.local/bin/projects
    hosts: '*'
    mode: "0755"
    conflict: backup
  - source: files/shared/home/.local/bin/mk-proj
    destination: ~/.local/bin/mk-proj
    hosts: '*'
    mode: "0755"
    conflict: backup
  - source: files/shared/home/.config/waybar
    destination: ~/.config/waybar
    hosts: '*'
    exclude:
      - colors.css
    conflict: backup
  - source: files/shared/home/.config/fuzzel/fuzzel.ini
    destination: ~/.config/fuzzel/fuzzel.ini
    hosts: '*'
    mode: "0644"
    conflict: backup
  - source: files/shared/home/.local/bin/fuzzel-calculator.sh
    destination: ~/.local/bin/fuzzel-calculator.sh
    hosts: '*'
    mode: "0755"
    conflict: backup
  - source: files/shared/home/.local/bin/fuzzel-files.sh
    destination: ~/.local/bin/fuzzel-files.sh
